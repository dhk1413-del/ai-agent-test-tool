# AI 测试平台外网入口（自定义登录页 + 会话 Cookie）
#   Cloudflare Tunnel / Tailscale Funnel  →  127.0.0.1:8081 (nginx)
#   未登录 → 302 /login（auth 服务 8090 提供登录页与会话校验）
server {
    listen 127.0.0.1:8081;
    server_name _;

    absolute_redirect off;

    client_max_body_size 50m;

    # ---------- 登录 / 退出（不鉴权） ----------
    location = /login {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/ai-tester-proxy.inc;
    }
    location = /logout {
        proxy_pass http://127.0.0.1:8090;
        include /etc/nginx/ai-tester-proxy.inc;
    }

    # ---------- 内部鉴权子请求 ----------
    location = /_authcheck {
        internal;
        proxy_pass http://127.0.0.1:8090/_authcheck;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header X-Original-URI $request_uri;
    }

    # ---------- 测试进度 SSE（CF 会缓冲，对 CF 直接 503 让前端降级轮询） ----------
    location ~ ^/api/runs/[^/]+/events$ {
        auth_request /_authcheck;
        error_page 401 = @login_redirect;
        if ($http_cf_ray != "") { return 503; }
        proxy_pass http://127.0.0.1:3789;
        include /etc/nginx/ai-tester-proxy.inc;
    }

    # ---------- 接口：未登录返回 401 JSON ----------
    location ~ ^/api/ {
        auth_request /_authcheck;
        error_page 401 = @api_unauthorized;
        proxy_pass http://127.0.0.1:3789;
        include /etc/nginx/ai-tester-proxy.inc;
    }

    # ---------- 页面与静态资源 ----------
    location / {
        auth_request /_authcheck;
        error_page 401 = @login_redirect;
        proxy_pass http://127.0.0.1:3789;
        include /etc/nginx/ai-tester-proxy.inc;
    }

    location @login_redirect {
        return 302 /login?next=$request_uri;
    }
    location @api_unauthorized {
        default_type application/json;
        add_header Cache-Control no-store always;
        return 401 "{\"error\":\"未登录或登录已过期\"}";
    }
}
